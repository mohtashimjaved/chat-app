<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatgram</title>
    <link rel="shortcut icon" href="./5962463.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="bg-decoration">
        <div class="glow-orb" id="orb-1"></div>
        <div class="glow-orb" id="orb-2"></div>
        <div class="glow-orb" id="orb-3"></div>
    </div>
    <div class="body_container">
        <div class="sidebar-overlay" id="sidebar_overlay"></div>
        <div id="list_container"></div>
        <div id="chat_container">
            <div class="initial-state">
                <div class="welcome-card">
                    <i class="fas fa-comments"></i>
                    <h2>Welcome to Chatgram</h2>
                    <p>Select a user from the sidebar to start a conversation</p>
                </div>
            </div>
        </div>
    </div>
    <div class="logout-modal" id="logout_modal">
        <div class="modal-content">
            <h3>Confirm Logout</h3>
            <p>Are you sure you want to logout</p>
            <div class="modal-buttons">
                <button class="modal-btn cancel" id="cancel_logout">Cancel</button>
                <button class="modal-btn confirm" id="confirm_logout">Logout</button>
            </div>
        </div>
    </div>

    <!-- Message Delete Modal -->
    <div class="logout-modal" id="delete_modal">
        <div class="modal-content">
            <h3>Delete Message</h3>
            <p>Are you sure you want to delete this message? This action cannot be undone.</p>
            <div class="modal-buttons">
                <button class="modal-btn cancel" id="cancel_delete">Cancel</button>
                <button class="modal-btn confirm" id="confirm_delete">Delete</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://kit.fontawesome.com/a7577e03bc.js" crossorigin="anonymous"></script>
    <script type="module" src="./app.js"></script>
    <script type="module" src="./database.js"></script>
</body>

</html>
